name: SQL Server integration (manual, x86-64)

# This workflow is intentionally NOT triggered by push/pull_request.
# The operator must accept the Microsoft SQL Server EULA and configure the
# SQLSERVER_SA_PASSWORD secret before manually dispatching it. The job sets
# ACCEPT_EULA only after that explicit manual input. Do not treat this file as
# evidence that a SQL Server run occurred.
on:
  workflow_dispatch:
    inputs:
      accept_sqlserver_eula:
        description: 'I accept the Microsoft SQL Server EULA for this disposable test container'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sqlserver-integration
  cancel-in-progress: false

jobs:
  sqlserver:
    if: ${{ inputs.accept_sqlserver_eula == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: sqlserver-integration

    services:
      sqlserver:
        # Explicit pinned Microsoft Linux x86-64 image, not :latest.
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.SQLSERVER_SA_PASSWORD }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $MSSQL_SA_PASSWORD -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.402'
          global-json-file: global.json

      - name: Restore and build
        run: |
          bash scripts/dotnet.sh restore DigitalBanking.slnx --nologo
          bash scripts/dotnet.sh build DigitalBanking.slnx --no-restore --nologo

      - name: Wait for SQL Server port (bounded)
        run: |
          python3 - <<'PY'
          import socket, sys, time
          for _ in range(60):
              try:
                  with socket.create_connection(("127.0.0.1", 1433), timeout=2):
                      print("SQL Server port is ready.")
                      sys.exit(0)
              except OSError:
                  time.sleep(2)
          print("SQL Server port did not become ready.", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Real SQL Server integration (8/8 required)
        env:
          DIGITALBANKING_SQLSERVER_CONNECTION: 'Server=127.0.0.1,1433;Database=master;User Id=sa;Password=${{ secrets.SQLSERVER_SA_PASSWORD }};Encrypt=true;TrustServerCertificate=true;'
          DIGITALBANKING_SQLSERVER_ALLOW_DESTRUCTIVE: '1'
        run: |
          mkdir -p artifacts/sqlserver
          bash scripts/dotnet.sh test DigitalBanking.IntegrationTests/DigitalBanking.IntegrationTests.csproj \
            --no-build --nologo --results-directory "$PWD/artifacts/sqlserver" \
            --logger "trx;LogFileName=sqlserver.trx"
          python3 scripts/verify_sqlserver_trx.py "$PWD/artifacts/sqlserver/sqlserver.trx" \
            --expected 8 --output "$PWD/artifacts/sqlserver/summary.txt"

      - name: Upload sanitized SQL Server summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sqlserver-summary
          path: artifacts/sqlserver/summary.txt
          if-no-files-found: ignore
          retention-days: 7
